name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: cos-upload-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - name: Set up Calcit and Caps
      uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
      with:
        tools: calcit,caps

    - name: Resolve immutable dependencies
      run: |
        set -euo pipefail
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain

    - name: Check canonical snapshot
      run: |
        set -euo pipefail
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru

    - name: Check both entries
      run: |
        set -euo pipefail
        calcit --check-only calcit.cirru
        calcit --check-only --entry test calcit.cirru

    - name: Enforce static quality baselines
      run: |
        set -euo pipefail
        mkdir -p .calcit
        calcit calcit.cirru analyze check-types --summary-only --format json > .calcit/check-types.json
        calcit calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic --intent unresolved --summary-only --format json > .calcit/weak-types.json
        calcit calcit.cirru analyze deprecated --summary-only --format json > .calcit/deprecated.json
        node scripts/check-calcit-upgrade-baseline.mjs
        calcit calcit.cirru analyze dynamic-methods --format json | jq -e '.data.summary.findings == 0'

    - name: Run attached tests
      run: calcit calcit.cirru test --require-match --summary-only --format json

    - name: Select CDN asset prefix
      id: asset-path
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/"
        else
          asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/"
        fi
        base_url="https://cos-sh.tiye.me/${asset_prefix}"
        echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"
        echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"

    - name: Build demo
      run: |
        set -euo pipefail
        calcit calcit.cirru js
        yarn vite build

    - name: Upload static assets to COS
      if: steps.asset-path.outcome == 'success'
      uses: worktools/cos-upload-action@06d6027dcca6413c5936e04a9b6e9f0d5ef71ba0 # v1.2.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.asset-path.outputs.prefix }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}
        public-base-url: ${{ steps.asset-path.outputs.base-url }}

    - name: Deploy to server
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        DEPLOY_KEY: ${{ secrets.rsync_private_key }}
      run: |
        set -euo pipefail
        test -n "$DEPLOY_KEY"
        ssh_dir="$RUNNER_TEMP/respo-router-ssh"
        key_file="$ssh_dir/id_ed25519"
        known_hosts_file="$GITHUB_WORKSPACE/.github/ssh_known_hosts"
        matching_keys="$ssh_dir/tiye.me-ed25519"
        install -d -m 700 "$ssh_dir"
        install -m 600 /dev/null "$key_file"
        printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$key_file"
        trap 'rm -f "$key_file" "$matching_keys"' EXIT
        awk '$1 == "tiye.me" && $2 == "ssh-ed25519" { print }' "$known_hosts_file" > "$matching_keys"
        test "$(awk 'NF { count += 1 } END { print count + 0 }' "$matching_keys")" -eq 1
        actual_fingerprint="$(ssh-keygen -lf "$matching_keys" | awk '{ print $2 }')"
        test "$actual_fingerprint" = 'SHA256:f0ME3+UEzCM357Vtdic/bay2ygVUULBJ2pfaPTjBYhg'
        rsync -avzr --progress \
          -e "ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts_file" \
          dist/ "rsync-user@tiye.me:/web-assets/repo/${GITHUB_REPOSITORY}/"
