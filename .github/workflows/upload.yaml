name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.12.0 --activate
        yarn --version

    - name: Set up Calcit 0.13.77 and Caps
      uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180
      with:
        version: 0.13.77
        tools: calcit,caps

    - name: Resolve immutable dependencies
      run: |
        set -euo pipefail
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain

    - name: Check canonical snapshot
      run: |
        set -euo pipefail
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru

    - name: Check both entries
      run: |
        set -euo pipefail
        calcit --check-only calcit.cirru
        calcit --check-only --entry test calcit.cirru

    - name: Enforce static quality baselines
      run: |
        set -euo pipefail
        mkdir -p .calcit
        calcit calcit.cirru analyze check-types --summary-only --format json > .calcit/check-types.json
        calcit calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic --intent unresolved --summary-only --format json > .calcit/weak-types.json
        calcit calcit.cirru analyze deprecated --summary-only --format json > .calcit/deprecated.json
        node scripts/check-calcit-upgrade-baseline.mjs
        calcit calcit.cirru analyze dynamic-methods --max 3

    - name: Run attached tests
      run: calcit calcit.cirru test --require-match --summary-only --format json

    - name: Build demo
      run: |
        set -euo pipefail
        calcit calcit.cirru js
        yarn vite build --base=./

    - name: Deploy to server
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        DEPLOY_KEY: ${{ secrets.rsync_private_key }}
      run: |
        set -euo pipefail
        test -n "$DEPLOY_KEY"
        ssh_dir="$RUNNER_TEMP/respo-router-ssh"
        key_file="$ssh_dir/id_ed25519"
        known_hosts_file="$GITHUB_WORKSPACE/.github/ssh_known_hosts"
        matching_keys="$ssh_dir/tiye.me-ed25519"
        install -d -m 700 "$ssh_dir"
        install -m 600 /dev/null "$key_file"
        printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$key_file"
        trap 'rm -f "$key_file" "$matching_keys"' EXIT
        awk '$1 == "tiye.me" && $2 == "ssh-ed25519" { print }' "$known_hosts_file" > "$matching_keys"
        test "$(awk 'NF { count += 1 } END { print count + 0 }' "$matching_keys")" -eq 1
        actual_fingerprint="$(ssh-keygen -lf "$matching_keys" | awk '{ print $2 }')"
        test "$actual_fingerprint" = 'SHA256:f0ME3+UEzCM357Vtdic/bay2ygVUULBJ2pfaPTjBYhg'
        rsync -avzr --progress \
          -e "ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts_file" \
          dist/ "rsync-user@tiye.me:/web-assets/repo/${GITHUB_REPOSITORY}/"
